name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Check patch/dependencies
        env:
          SKIP_PLUGIN_CHECK: '1'
        run: bash scripts/check.sh
